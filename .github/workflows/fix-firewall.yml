name: Fix Firewall + SSH

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Fix SSH key permissions
        run: |
          echo "--- fix authorized_keys ---"
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S ls -la /home/dev/.ssh/ 2>&1
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S chmod 700 /home/dev/.ssh
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S chmod 600 /home/dev/.ssh/authorized_keys
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S chown -R dev:dev /home/dev/.ssh
          echo "--- after fix ---"
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S ls -la /home/dev/.ssh/ 2>&1
          echo "✅ permissions fixed"
