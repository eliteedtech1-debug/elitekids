name: Fix Firewall + SSH

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Full SSH debug
        run: |
          echo "--- authorized_keys content ---"
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S cat /home/dev/.ssh/authorized_keys 2>&1
          echo "--- sshd_config ---"
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S grep -v '^#\|^$' /etc/ssh/sshd_config 2>&1
          echo "--- iptables INPUT full ---"
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S iptables -L INPUT -n -v 2>&1
          echo "--- test password auth ---"
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S grep -i "PasswordAuthentication\|PubkeyAuthentication\|PermitRootLogin" /etc/ssh/sshd_config 2>&1
          echo "✅ done"
