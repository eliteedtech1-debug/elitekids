name: Deploy EliteKids

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          VITE_API_URL="" npm run build

      - name: Install Backend deps
        run: |
          cd backend
          npm ci --omit=dev

      - name: Deploy Frontend to VPS
        run: |
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S rsync -az --delete \
            --exclude node_modules \
            frontend/dist/ /var/www/html/elite/elite-kids/frontend/dist/

      - name: Deploy Backend to VPS
        run: |
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude logs \
            --exclude coverage \
            backend/ /var/www/html/elite/elite-kids/backend/

      - name: Deploy Game Engine to VPS
        run: |
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S rsync -az --delete \
            --exclude node_modules \
            game-engine/ /var/www/html/elite/elite-kids/game-engine/

      - name: Restart service
        run: |
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart elite-kids
          sleep 2
          if systemctl is-active --quiet elite-kids; then
            echo "✓ elite-kids running"
          else
            echo "✗ elite-kids FAILED"
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl status elite-kids --no-pager
            exit 1
          fi
