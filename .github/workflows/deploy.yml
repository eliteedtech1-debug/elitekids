name: Deploy EliteKids (live)

# Self-deploy: a push to `main` (or manual dispatch) deploys the LIVE service
# on the VPS self-hosted runner.
#
# Live layout contract (verified against the running service):
#   • code dir    = /var/www/html/elite/elite-kids  (a git checkout of this repo)
#   • backend     = systemd USER unit `elite-kids-api` on :8484 (nginx proxy)
#   • frontend    = built `frontend/dist` (nginx docroot detected from nginx config)
#   • game-engine = inside the git checkout (updated by the backend git
#     reset below — no separate rsync; a stale runner workspace once
#     re-copied an old scene-script.schema.json over the live tree)
#
# No sudo needed: everything runs as the `dev` user who owns the checkout and
# the user units. node_modules / node_modules / .env / .git are never touched
# by rsync of file trees; the backend update is a git fast-forward of the live
# checkout, which is exactly how the service has been patched all along.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: elitekids-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy backend (git fast-forward live checkout)
        env:
          ELITEKIDS_TOKEN: ${{ secrets.ELITEKIDS_TOKEN }}
        run: |
          set -e
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          # Use Node 22 via nvm (other apps stay on system Node 20)
          source ~/.nvm/nvm.sh && nvm use 22
          LIVE=/var/www/html/elite/elite-kids
          echo "==== Deploy EliteKids $(date -u +%Y-%m-%dT%H:%M:%SZ) head $(git rev-parse --short HEAD) ===="

          [ -d "$LIVE/.git" ] || { echo "❌ $LIVE is not a git checkout — refusing"; exit 1; }
          cd "$LIVE"

          # Use token from Actions secret for auth (avoids plaintext PAT on disk)
          git remote set-url origin "https://x-access-token:${ELITEKIDS_TOKEN}@github.com/eliteedtech1-debug/elitekids.git"

          # Preserve any local-only working-tree edits as a STASH COMMIT without
          # touching the tree (never `git stash pop` — popping a stale stash onto
          # new code leaves conflict markers that break the API boot; see
          # 2026-09-04 incident). The commit hash is written to /tmp for manual
          # recovery; .env / node_modules are untouched by reset --hard.
          LOCAL_STASH="$(git stash create 2>/dev/null || true)"
          if [ -n "$LOCAL_STASH" ]; then
            echo "$LOCAL_STASH" > /tmp/elitekids-local-stash-$(date +%s).txt
            echo "local edits preserved as $LOCAL_STASH (see /tmp/elitekids-local-stash-*.txt)"
          fi
          git fetch origin main 2>&1 | tail -1
          BEFORE=$(git rev-parse --short HEAD)
          git reset --hard origin/main
          AFTER=$(git rev-parse --short HEAD)
          echo "backend: $BEFORE -> $AFTER"
          # Gate: refuse to continue if conflict markers or unmerged paths
          # survived (stops a silently-broken tree from reaching the restart).
          if git ls-files -u | grep -q . \
             || grep -rqE '^(<<<<<<<|>>>>>>>)' src ../frontend/src 2>/dev/null; then
            echo "❌ CONFLICT MARKERS / UNMERGED PATHS in tree — refusing to continue"
            exit 1
          fi

          # Install the locked dev dependencies before the backend acceptance
          # gate; Jest is required by scripts/run-tests.sh.
          # pipefail ensures npm ci failures are caught (previously swallowed by tail).
          cd backend
          set -o pipefail
          npm ci --include=dev --no-audit --no-fund 2>&1 | tail -5
          # Sanity check: supertest must be present or integration tests fail.
          if [ ! -d node_modules/supertest ]; then
            echo "❌ supertest missing after npm ci — retrying fresh install"
            rm -rf node_modules
            npm ci --include=dev --no-audit --no-fund 2>&1 | tail -5
          fi
          set +o pipefail
          bash ../scripts/run-tests.sh --forceExit
          npm prune --omit=dev --no-audit --no-fund 2>&1 | tail -1

          # Restart the live user unit + verify
          systemctl --user restart elite-kids-api
          sleep 2
          systemctl --user is-active elite-kids-api
          echo "--- health ---"
          curl -sf http://127.0.0.1:8484/health || curl -s -o /dev/null -w 'root http %{http_code}\n' http://127.0.0.1:8484/ || true
          echo "--- recent log ---"
          journalctl --user -u elite-kids-api -n 8 --no-pager | tail -8

      - name: Deploy frontend (build + rsync to nginx docroot, non-fatal)
        run: |
          set +e
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          source ~/.nvm/nvm.sh && nvm use 22
          LIVE=/var/www/html/elite/elite-kids
          cd "$LIVE/frontend" || exit 0
          DOCROOT=$(grep -rhoE '/var/www[^ ;]+elite-kids[^ ;]*' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -1)
          [ -n "$DOCROOT" ] || DOCROOT=/var/www/html/elite/elite-kids/frontend/dist
          echo "frontend docroot: $DOCROOT"
          npm ci --no-audit --no-fund 2>&1 | tail -2
          npm run build 2>&1 | tail -4
          mkdir -p "$DOCROOT"
          rsync -a --delete dist/ "$DOCROOT/"
          echo "frontend deployed to $DOCROOT (exit $?)"
          echo "(frontend step is non-fatal by design — backend deploy already completed)"

      - name: Verify externally
        run: |
          set +e
          for url in \
            "http://127.0.0.1:8484/health" \
            "https://kids.elitekids.com.ng/schools/get-details?query_type=select-by-short-name&short_name=elite" \
            "https://demo.elitekids.com.ng/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            echo "$code  $url"
          done
          echo "==== DONE ===="