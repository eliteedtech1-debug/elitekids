name: Deploy EliteKids (live)

# Self-deploy: a push to `main` (or manual dispatch) deploys the LIVE service
# on the VPS self-hosted runner.
#
# Live layout contract (verified against the running service):
#   • code dir    = /var/www/html/elite/elite-kids  (a git checkout of this repo)
#   • backend     = systemd USER unit `elite-kids-api` on :8484 (nginx proxy)
#   • frontend    = `scripts/rebuild-frontend.sh` (shared with the post-receive
#     hook): staging build → publish gate → atomic release swap onto the nginx
#     docroot. The docroot is NEVER the build output dir, so a failed/aborted
#     build cannot wipe the live shell.
#   • game-engine = inside the git checkout (updated by the backend git
#     reset below — no separate rsync; a stale runner workspace once
#     re-copied an old scene-script.schema.json over the live tree)
#
# No sudo needed: everything runs as the `dev` user who owns the checkout and
# the user units. node_modules / node_modules / .env / .git are never touched
# by rsync of file trees; the backend update is a git fast-forward of the live
# checkout, which is exactly how the service has been patched all along.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: elitekids-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy backend (git fast-forward live checkout)
        env:
          ELITEKIDS_TOKEN: ${{ secrets.ELITEKIDS_TOKEN }}
        run: |
          set -e
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          # Use Node 22 via nvm (other apps stay on system Node 20)
          source ~/.nvm/nvm.sh && nvm use 22
          LIVE=/var/www/html/elite/elite-kids
          echo "==== Deploy EliteKids $(date -u +%Y-%m-%dT%H:%M:%SZ) head $(git rev-parse --short HEAD) ===="

          [ -d "$LIVE/.git" ] || { echo "❌ $LIVE is not a git checkout — refusing"; exit 1; }
          cd "$LIVE"

          # Use token from Actions secret for auth (avoids plaintext PAT on disk)
          git remote set-url origin "https://x-access-token:${ELITEKIDS_TOKEN}@github.com/eliteedtech1-debug/elitekids.git"

          # Preserve any local-only working-tree edits as a STASH COMMIT without
          # touching the tree (never `git stash pop` — popping a stale stash onto
          # new code leaves conflict markers that break the API boot; see
          # 2026-09-04 incident). The commit hash is written to /tmp for manual
          # recovery; .env / node_modules are untouched by reset --hard.
          LOCAL_STASH="$(git stash create 2>/dev/null || true)"
          if [ -n "$LOCAL_STASH" ]; then
            echo "$LOCAL_STASH" > /tmp/elitekids-local-stash-$(date +%s).txt
            echo "local edits preserved as $LOCAL_STASH (see /tmp/elitekids-local-stash-*.txt)"
          fi
          git fetch origin main 2>&1 | tail -1
          BEFORE=$(git rev-parse --short HEAD)
          git reset --hard origin/main
          AFTER=$(git rev-parse --short HEAD)
          echo "backend: $BEFORE -> $AFTER"
          # Gate: refuse to continue if conflict markers or unmerged paths
          # survived (stops a silently-broken tree from reaching the restart).
          if git ls-files -u | grep -q . \
             || grep -rqE '^(<<<<<<<|>>>>>>>)' src ../frontend/src 2>/dev/null; then
            echo "❌ CONFLICT MARKERS / UNMERGED PATHS in tree — refusing to continue"
            exit 1
          fi

          # Install the locked dev dependencies before the backend acceptance
          # gate; Jest is required by scripts/run-tests.sh.
          # pipefail ensures npm ci failures are caught (previously swallowed by tail).
          cd backend
          set -o pipefail
          npm ci --include=dev --no-audit --no-fund 2>&1 | tail -5
          # Sanity check: supertest must be present or integration tests fail.
          if [ ! -d node_modules/supertest ]; then
            echo "❌ supertest missing after npm ci — retrying fresh install"
            rm -rf node_modules
            npm ci --include=dev --no-audit --no-fund 2>&1 | tail -5
          fi
          set +o pipefail
          set +e
          # Backend acceptance gate. run-tests.sh restores dev deps itself if a
          # previous deploy pruned them (preflight guard). Retry once with FULL
          # output on failure; the log persists on-box for forensics (the
          # results service retains nothing after upload).
          GATE_LOG="/tmp/elitekids-backend-gate-$(date +%Y%m%dT%H%M%SZ).log"
          bash ../scripts/run-tests.sh --forceExit > "$GATE_LOG" 2>&1
          GATE_RC=$?
          if [ "$GATE_RC" -ne 0 ]; then
            echo "backend gate failed once (rc=$GATE_RC) — retrying with full output"
            bash ../scripts/run-tests.sh --forceExit 2>&1 | tee "$GATE_LOG"
            GATE_RC=${PIPESTATUS[0]}
          fi
          if [ "$GATE_RC" -ne 0 ]; then
            echo "❌ backend gate FAILED — last 40 lines of $GATE_LOG:"
            tail -40 "$GATE_LOG"
            exit 1
          fi
          tail -4 "$GATE_LOG"
          echo "gate log: $GATE_LOG"
          set -e

          # Restart the live user unit + verify
          systemctl --user restart elite-kids-api
          sleep 2
          systemctl --user is-active elite-kids-api
          echo "--- health ---"
          curl -sf http://127.0.0.1:8484/health || curl -s -o /dev/null -w 'root http %{http_code}\n' http://127.0.0.1:8484/ || true
          echo "--- recent log ---"
          journalctl --user -u elite-kids-api -n 8 --no-pager | tail -8

      - name: Apply nginx config (no-cache shell) via sudo
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          set -e
          LIVE=/var/www/html/elite/elite-kids
          CONF="$LIVE/deploy/nginx/elitekids.conf"
          TARGET=/etc/nginx/sites-enabled/elitekids
          [ -f "$CONF" ] || { echo "no repo nginx config — skipping"; exit 0; }
          if ! printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' true 2>/dev/null; then
            echo "❌ sudo auth failed — check the SUDO_PASSWORD Actions secret"; exit 1
          fi
          if cmp -s "$CONF" "$TARGET"; then
            echo "nginx config unchanged — skipping"
          else
            BK="/tmp/elitekids-nginx-backup-$(date +%Y%m%dT%H%M%SZ).conf"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp "$TARGET" "$BK"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp "$CONF" "$TARGET"
            if printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t 2>&1; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -s reload
              echo "nginx config applied + reloaded (backup: $BK)"
            else
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' cp "$BK" "$TARGET"
              echo "❌ nginx -t failed after applying repo config — restored from backup $BK"
              exit 1
            fi
          fi

      # Delegates to scripts/rebuild-frontend.sh so the CI deploy and the
      # post-receive hook publish identically. That script enforces the three
      # hard rules: the docroot is never the build output dir, nothing is
      # published until the staged tree passes the gate, and the swap is a single
      # symlink flip onto a versioned release dir.
      # 2026-09-14 incident: an in-place vite build emptied `frontend/dist`
      # (== docroot), the run died, and the old `rsync --delete dist/` mirrored
      # the shell-less tree into production → 403 Forbidden on every route,
      # silently (the step was non-fatal and the verify step never failed).
      - name: Deploy frontend (staging build + gate + release swap via rebuild-frontend.sh)
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          source ~/.nvm/nvm.sh && nvm use 22
          LIVE=/var/www/html/elite/elite-kids
          cd "$LIVE/frontend"
          DOCROOT=$(grep -rhoE '/var/www[^ ;]+elite-kids[^ ;]*' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -1)
          [ -n "$DOCROOT" ] || DOCROOT=/var/www/html/elite/elite-kids/frontend/dist
          echo "frontend docroot: $DOCROOT"
          npm ci --no-audit --no-fund 2>&1 | tail -2

          LOG="/tmp/elitekids-frontend-publish-$(date +%Y%m%dT%H%M%SZ).log"
          if ! DOCROOT="$DOCROOT" bash "$LIVE/scripts/rebuild-frontend.sh" > "$LOG" 2>&1; then
            echo "❌ frontend build/publish FAILED — docroot NOT touched. Last 40 lines of $LOG:"
            tail -40 "$LOG"
            exit 1
          fi
          tail -12 "$LOG"

      # Fails the job on ANY non-200, or on a shell served without no-cache. A
      # deploy that leaves production at 403 (missing/partial shell) must show up
      # as a red build, not a green one with a quiet "403" line in the log — that
      # is how the 2026-09-14 outage sat unnoticed from Sep 11. The cache-header
      # assertion guards the other half of that incident class: a heuristic-cached
      # shell keeps pointing at assets a later release deleted.
      - name: Verify externally (non-200 or cacheable shell fails the deploy)
        run: |
          set +e
          FAILED=0
          for url in \
            "http://127.0.0.1:8484/health" \
            "https://kids.elitekids.com.ng/" \
            "https://kids.elitekids.com.ng/schools/get-details?query_type=select-by-short-name&short_name=elite" \
            "https://demo.elitekids.com.ng/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            if [ "$code" = "200" ]; then
              echo "✅ $code  $url"
            else
              echo "❌ $code  $url  (expected 200)"
              FAILED=$((FAILED + 1))
            fi
          done
          echo "--- shell cache headers (must be no-cache) ---"
          SHELL_HEADERS=$(curl -sI --max-time 15 https://kids.elitekids.com.ng/ | tr -d '\r')
          echo "$SHELL_HEADERS" | grep -iE '^(HTTP|cache-control|pragma)'
          if ! echo "$SHELL_HEADERS" | grep -iq '^cache-control:.*no-cache'; then
            echo "❌ shell served without 'Cache-Control: no-cache' — a cached shell can reference assets a later release deleted (stuck boot loader)"
            FAILED=$((FAILED + 1))
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "==== FAILED: $FAILED external check(s) failed — see the ❌ lines above (non-200 or cacheable shell) ===="
            exit 1
          fi
          echo "==== DONE — all external checks passed (200 + no-cache shell) ===="