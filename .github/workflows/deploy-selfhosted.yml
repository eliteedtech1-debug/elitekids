# Self-hosted runner on VPS (62.72.0.209)
# Runner runs locally — no SSH needed

name: Deploy EliteKids to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend
        run: |
          cd frontend
          npm install 2>&1 | tail -3
          npm run build 2>&1 | tail -5

      - name: Deploy frontend
        run: |
          DEST=/var/www/html/elite-kids/frontend
          mkdir -p "$DEST/dist"
          rsync -av --delete frontend/dist/ "$DEST/dist/"

      - name: Deploy backend
        run: |
          DEST=/var/www/html/elite-kids/backend
          mkdir -p "$DEST"
          rsync -av --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude logs \
            --exclude coverage \
            --exclude .git \
            backend/ "$DEST/"

      - name: Deploy game-engine
        run: |
          DEST=/var/www/html/elite-kids/game-engine
          mkdir -p "$DEST"
          rsync -av --delete \
            --exclude node_modules \
            --exclude .env \
            game-engine/ "$DEST/"

      - name: Install backend deps
        run: |
          cd /var/www/html/elite-kids/backend
          npm install --production 2>&1 | tail -5

      - name: Setup systemd services
        run: |
          # EliteKids API
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S tee /etc/systemd/system/elite-kids.service > /dev/null << 'EOF'
          [Unit]
          Description=EliteKids API Server
          After=network.target mysql.service

          [Service]
          Type=simple
          User=dev
          Group=dev
          WorkingDirectory=/var/www/html/elite-kids/backend
          ExecStart=/usr/bin/node src/index.js
          Restart=on-failure
          RestartSec=10
          Environment=NODE_ENV=production
          Environment=PORT=8484
          LimitNOFILE=65536
          MemoryMax=512M

          [Install]
          WantedBy=multi-user.target
          EOF

          # EliteKids Frontend (static server)
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S tee /etc/systemd/system/elite-kids-web.service > /dev/null << 'EOF'
          [Unit]
          Description=EliteKids Frontend Server
          After=network.target elite-kids.service

          [Service]
          Type=simple
          User=dev
          Group=dev
          WorkingDirectory=/var/www/html/elite-kids
          ExecStart=/usr/bin/npx serve frontend/dist -l 34601 -s
          Restart=on-failure
          RestartSec=10
          Environment=NODE_ENV=production
          LimitNOFILE=65536
          MemoryMax=256M

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Restart elite-kids services
        run: |
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl daemon-reload
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl enable elite-kids elite-kids-web
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart elite-kids
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart elite-kids-web
          sleep 3

      - name: Health check
        run: |
          echo "=== EliteKids Services ==="
          for svc in elite-kids elite-kids-web; do
            if echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl is-active --quiet $svc; then
              echo "  ✓ $svc running"
            else
              echo "  ✗ $svc FAILED"
              echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S journalctl -u $svc -n 10 --no-pager
              exit 1
            fi
          done

          echo "=== Port Check ==="
          HEALTH=$(curl -sf http://127.0.0.1:8484/health 2>/dev/null || echo "FAIL")
          echo "Backend: $HEALTH"

          if echo "$HEALTH" | grep -qi "fail"; then
            echo "✗ Backend health check failed"
            exit 1
          fi

          echo "✓ Deploy complete — https://elitekids.com.ng"
