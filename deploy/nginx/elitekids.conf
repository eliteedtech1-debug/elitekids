# EliteKids nginx site config — SOURCE OF TRUTH in repo (deploy/nginx/elitekids.conf).
# Applied by .github/workflows/deploy.yml (sudo step) with automatic backup+restore
# if `nginx -t` fails. Never edit /etc/nginx/sites-enabled/elitekids by hand.
#
# Change 2026-09-06: the HTML shell and sw.js are now no-cache. Previously the
# shell had NO Cache-Control → browsers heuristic-cache it (grows with
# Last-Modified age). After any deploy, a returning device could serve stale
# HTML referencing hashed assets that rsync --delete removed → 404 → app never
# boots (stuck on the boot loader). Hashed /assets/* stay immutable-cached.

upstream elitekids_backend {
    server 127.0.0.1:8484;
    keepalive 32;
}

# ── Redirect HTTP → HTTPS for elitekids.com.ng ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name elitekids.com.ng *.elitekids.com.ng;
    return 301 https://$host$request_uri;
}

# ── HTTPS server for elitekids.com.ng + wildcards ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name elitekids.com.ng *.elitekids.com.ng;

    ssl_certificate     /etc/letsencrypt/live/elitekids.com.ng-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elitekids.com.ng-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html/elite/elite-kids/frontend/dist;
    index index.html;

    # ── Vite assets (immutable cache) ──────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── App shell: NEVER cached (stale HTML → deleted assets → stuck loader) ──
    # Exact-match also catches the SPA fallback's internal redirect to /index.html.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Backend API routes ─────────────────────────────────────────────────
    location ~ ^/(kids|schools|users|students|auth|verify-token|media|health)(/|$) {
        proxy_pass http://elitekids_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── SPA fallback (all other routes → index.html) ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
