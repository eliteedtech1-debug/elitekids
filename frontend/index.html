<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F4D92" />
    <meta
      name="description"
      content="Elite Kids — nursery learning platform: play-based games, lessons and progress tracking."
    />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>Elite Kids — Nursery Learning Platform</title>
    <script>
      // EliteKids boot script — MUST stay ES5-compatible (no let/const/arrows/
      // template strings) so ancient WebViews can parse it. Runs before any app
      // bundle: paints an instant branded splash (never a blank white screen),
      // tags low-end devices synchronously, and shows a graceful "update your
      // browser" card if the app genuinely cannot boot.
      (function () {
        function detectLowEnd() {
          try {
            var mem = typeof navigator.deviceMemory === 'number' ? navigator.deviceMemory : 0;
            var cores = typeof navigator.hardwareConcurrency === 'number' ? navigator.hardwareConcurrency : 4;
            var w = window.screen ? screen.width : 0;
            var h = window.screen ? screen.height : 0;
            if (mem > 0 && mem <= 2) return true;
            if (cores <= 2) return true;
            if (w > 0 && h > 0 && w <= 360 && h <= 640) return true;
          } catch (e) {}
          return false;
        }
        if (detectLowEnd()) {
          try {
            document.documentElement.setAttribute('data-low-end', 'true');
            window.__ELITE_KIDS_LOW_END__ = true;
          } catch (e) {}
        }
        var splash = document.createElement('div');
        splash.id = 'boot-splash';
        splash.setAttribute('role', 'status');
        splash.style.cssText =
          'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;' +
          'justify-content:center;background:linear-gradient(165deg,#f0fdfa 0%,#e0f7ef 55%,#fef3c7 100%);';
        splash.innerHTML =
          '<img src="/logo.svg" alt="" style="width:78px;height:78px;object-fit:contain;">' +
          '<div style="margin-top:14px;font:700 19px/1.3 Fredoka, Nunito, system-ui, sans-serif;color:#0F4D92;">EliteKids</div>' +
          '<div style="margin-top:24px;width:34px;height:34px;border-radius:50%;border:4px solid rgba(13,148,136,.18);' +
          'border-top-color:#0d9488;-webkit-animation:ek-spin .9s linear infinite;animation:ek-spin .9s linear infinite;"></div>' +
          '<style>@-webkit-keyframes ek-spin{to{-webkit-transform:rotate(360deg);transform:rotate(360deg)}}' +
          '@keyframes ek-spin{to{-webkit-transform:rotate(360deg);transform:rotate(360deg)}}</style>';
        function showBoot() {
          if (!document.body) { document.addEventListener('DOMContentLoaded', showBoot); return; }
          document.body.appendChild(splash);
        }
        if (document.body) showBoot(); else document.addEventListener('DOMContentLoaded', showBoot);
        function dismissSplash() {
          window.__ELITE_KIDS_READY__ = true;
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }
        function showUpgradeCard() {
          if (window.__ELITE_KIDS_READY__ || !splash || !splash.parentNode) return;
          splash.innerHTML =
            '<div style="max-width:320px;margin:16px;padding:26px 22px;background:#fff;border-radius:20px;' +
            'box-shadow:0 12px 44px rgba(13,148,136,.16);text-align:center;">' +
            '<div style="font:700 17px/1.35 Fredoka, Nunito, system-ui, sans-serif;color:#0F4D92;">Your browser is not supported</div>' +
            '<p style="margin-top:10px;font:400 13px/1.55 system-ui, -apple-system, sans-serif;color:#475569;">' +
            'EliteKids needs an up-to-date browser (Chrome 47+ or the latest Android WebView). Updating Chrome often makes it work.</p>' +
            '<a href="https://play.google.com/store/apps/details?id=com.android.chrome" rel="noopener" ' +
            'style="display:inline-block;margin-top:16px;padding:11px 24px;border-radius:12px;background:#0F4D92;color:#fff;' +
            'font:600 13px system-ui, -apple-system, sans-serif;text-decoration:none;">Update Chrome</a></div>';
        }
        // App signals readiness right after first React render (fired from main.tsx).
        document.addEventListener('app:ready', dismissSplash);
        // Hard-fail watchdog: if the app never mounts (script parse failure on old
        // WebView, blocked request, fatal runtime error) replace splash with a
        // helpful card instead of a permanent white screen.
        window.setTimeout(function () {
          if (!window.__ELITE_KIDS_READY__) showUpgradeCard();
        }, 15000);
        window.addEventListener('error', function () {
          if (!window.__ELITE_KIDS_READY__) window.setTimeout(showUpgradeCard, 1500);
        });
        // Backstop 1 — missed-event self-heal: if React mounted but the splash
        // is still up (event lost, old bundle), drop it as soon as #root has
        // content. Runs until ready; costs one getElementById per 500ms.
        function checkRootMounted() {
          var root = document.getElementById('root');
          if (root && root.firstChild && splash.parentNode) {
            dismissSplash();
          } else if (splash.parentNode && !window.__ELITE_KIDS_READY__) {
            window.setTimeout(checkRootMounted, 500);
          }
        }
        window.setTimeout(checkRootMounted, 1000);
        // Backstop 2 — stale-shell self-heal: a cached index.html can reference
        // hashed assets a new deploy deleted → script 404 → stuck loader. On the
        // first script resource error before ready, reload ONCE with a cache
        // busting param (sessionStorage flag prevents loops).
        window.addEventListener('error', function (e) {
          if (window.__ELITE_KIDS_READY__ || !e || !e.target || !e.target.src) return;
          if (!/\/assets\/.*\.js/.test(String(e.target.src))) return;
          try {
            if (sessionStorage.getItem('ek-boot-reload')) return;
            sessionStorage.setItem('ek-boot-reload', '1');
          } catch (err) {}
          window.location.replace(window.location.pathname + '?ek=' + Date.now());
        }, true);
        document.addEventListener('app:ready', function () {
          try { sessionStorage.removeItem('ek-boot-reload'); } catch (err) {}
        });
        // ── Legacy CSS switch ─────────────────────────────────────────────────
        // Tailwind v4's stylesheet is modern-only: `@layer` (Chrome 99+) wraps
        // everything and colors are oklch/color-mix (Chrome 111+). Old WebViews
        // parse it to ZERO rules → the unstyled login. Detect and redirect them
        // to index-compat.css (downleveled at build time, see scripts/compat-css.mjs).
        var legacyCssNeeded = (function () {
          try {
            var probe = document.createElement('style');
            probe.textContent = '@layer p{@media (min-width:0px){.c{c:red}}}';
            document.head.appendChild(probe);
            var n = 0;
            try { if (probe.sheet && probe.sheet.cssRules) n = probe.sheet.cssRules.length; } catch (e) {}
            document.head.removeChild(probe);
            if (n > 0) {
              // @layer works — only switch if oklch/color-mix are missing too
              if (window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in oklab, red, blue)')) return false;
            }
            return true;
          } catch (e) { return true; }
        })();
        if (legacyCssNeeded) {
          var swapped = false;
          function swapCss(l) {
            var href = l.getAttribute('href') || '';
            if (/assets\/index-[A-Za-z0-9_-]+\.css(\?.*)?$/.test(href)) {
              l.setAttribute('href', href.replace(/([^\/]*\/)?index-[A-Za-z0-9_-]+\.css/, '$1index-compat.css'));
              swapped = true;
            }
          }
          if (window.MutationObserver) {
            new MutationObserver(function () {
              var ls = document.head.querySelectorAll('link[rel="stylesheet"]');
              for (var i = 0; i < ls.length; i++) swapCss(ls[i]);
            }).observe(document.head, { childList: true, subtree: false });
          }
          // Backup: if the stylesheet link was already parsed before the
          // observer attached (or on ancient browsers without MutationObserver),
          // rewrite now + append the compat sheet as a guaranteed fallback.
          function ensureLegacyCss() {
            var ls = document.head.querySelectorAll('link[rel="stylesheet"]');
            for (var i = 0; i < ls.length; i++) swapCss(ls[i]);
            if (!swapped && !document.getElementById('compat-css')) {
              var link = document.createElement('link');
              link.id = 'compat-css';
              link.rel = 'stylesheet';
              link.href = 'assets/index-compat.css';
              document.head.appendChild(link);
            }
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ensureLegacyCss);
          else ensureLegacyCss();
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f0fdfa;font-family:system-ui,sans-serif;text-align:center;color:#475569;">
        EliteKids needs JavaScript enabled to load.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
