# ── coturn TURN server config for EliteKids WebRTC voice ──────────────────────
# Install: sudo apt-get install -y coturn
# Deploy:  sudo cp turnserver.conf /etc/turnserver.conf && sudo systemctl enable coturn && sudo systemctl restart coturn
# Verify:  turnutils_uclient -T -u elitekids -w secret123 turn:62.72.0.209:3478

# Listening ports
listening-port=3478
tls-listening-port=5349

# Listen on all interfaces (private VPS, no need to restrict)
listening-ip=0.0.0.0

# Relay IP — set to the VPS public IP for symmetric NAT traversal
relay-ip=62.72.0.209

# Authentication
lt-cred-mech
user=elitekids:secret123Turn!

# Realm (used as default domain)
realm=elitekids.com.ng

# Logging
log-file=/var/log/turnserver.log
simple-log

# Security
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Performance (low-end mobile: keep relay allocation conservative)
total-quota=100
stale-nonce=600
max-bps=0

# Allow UDP and TCP relay (TCP for CGNAT environments)
fingerprint
no-dtls

# Verbose for initial debugging (remove in production)
verbose
